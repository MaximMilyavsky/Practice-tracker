name: Build Health Connect APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-healthconnect/**"
      - ".github/workflows/build-healthconnect-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-healthconnect

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HealthConnectSleepDiagnostic.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HealthConnectSleepDiagnostic-apk
          path: android-healthconnect/HealthConnectSleepDiagnostic.apk
          if-no-files-found: error
          retention-days: 30
